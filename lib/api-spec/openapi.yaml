openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FarmDirect demo marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: marketplace
  - name: orders
  - name: insights
  - name: profiles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Validate a demo login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products:
    get:
      operationId: getProducts
      tags: [marketplace]
      summary: List available marketplace products
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Organic"
        - $ref: "#/components/parameters/Location"
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, price_asc, price_desc, popular]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [marketplace]
      summary: Add a product listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [marketplace]
      summary: Get a product detail
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProduct
      tags: [marketplace]
      summary: Update a product listing
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [marketplace]
      summary: Delete a product listing
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List orders for a customer or farmer
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [farmer, customer]
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a demo order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{id}/status:
    put:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Advance an order status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /forecast:
    get:
      operationId: getForecast
      tags: [insights]
      summary: Get explainable demand forecasts
      responses:
        "200":
          description: Forecast dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
  /analytics:
    get:
      operationId: getAnalytics
      tags: [insights]
      summary: Get farmer sales analytics
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
  /logistics:
    get:
      operationId: getLogistics
      tags: [insights]
      summary: Get delivery route insights
      responses:
        "200":
          description: Logistics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsResponse"
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a user profile
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProfile
      tags: [profiles]
      summary: Update a demo profile
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    Organic:
      name: organic
      in: query
      schema:
        type: boolean
    Location:
      name: location
      in: query
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [farmer, customer]
        phone:
          type: string
        location:
          type: string
      required: [id, name, email, role, phone, location]
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [farmer, customer]
      required: [email, password, role]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required: [user, message]
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
        unit:
          type: string
        quantity:
          type: number
        location:
          type: string
        harvestDate:
          type: string
        image:
          type: string
        organic:
          type: boolean
        available:
          type: boolean
        farmerId:
          type: string
        farmerName:
          type: string
        rating:
          type: number
        reviews:
          type: number
        createdAt:
          type: string
      required: [id, name, category, description, price, unit, quantity, location, harvestDate, image, organic, available, farmerId, farmerName, rating, reviews, createdAt]
    ProductInput:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
        unit:
          type: string
        quantity:
          type: number
        location:
          type: string
        harvestDate:
          type: string
        image:
          type: string
        organic:
          type: boolean
        available:
          type: boolean
        farmerId:
          type: string
      required: [name, category, description, price, unit, quantity, location, harvestDate, image, organic, available, farmerId]
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
        unit:
          type: string
        quantity:
          type: number
        location:
          type: string
        harvestDate:
          type: string
        image:
          type: string
        organic:
          type: boolean
        available:
          type: boolean
        farmerId:
          type: string
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        farmerId:
          type: string
        farmerName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        price:
          type: number
        image:
          type: string
      required: [productId, productName, farmerId, farmerName, quantity, unit, price, image]
    Order:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        deliveryFee:
          type: number
        total:
          type: number
        address:
          type: string
        city:
          type: string
        pinCode:
          type: string
        instructions:
          type: string
        paymentMethod:
          type: string
        date:
          type: string
        estimatedDelivery:
          type: string
        status:
          type: string
          enum: [placed, confirmed, preparing, ready, picked_up, in_transit, delivered, rejected]
      required: [id, customerId, customerName, items, subtotal, deliveryFee, total, address, city, pinCode, instructions, paymentMethod, date, estimatedDelivery, status]
    OrderInput:
      type: object
      properties:
        customerId:
          type: string
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        address:
          type: string
        city:
          type: string
        pinCode:
          type: string
        instructions:
          type: string
        paymentMethod:
          type: string
      required: [customerId, customerName, items, address, city, pinCode, instructions, paymentMethod]
    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [placed, confirmed, preparing, ready, picked_up, in_transit, delivered, rejected]
      required: [status]
    ForecastPoint:
      type: object
      properties:
        label:
          type: string
        actual:
          type: number
        predicted:
          type: number
      required: [label, actual, predicted]
    ForecastItem:
      type: object
      properties:
        product:
          type: string
        currentDemand:
          type: number
        predictedDemand:
          type: number
        growth:
          type: number
        classification:
          type: string
          enum: [high, medium, low]
        trend:
          type: string
          enum: [increasing, stable, decreasing]
        recommendation:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
      required: [product, currentDemand, predictedDemand, growth, classification, trend, recommendation, history]
    ForecastResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ForecastItem"
        summary:
          type: object
          properties:
            high:
              type: number
            increasing:
              type: number
            low:
              type: number
            recommendedStock:
              type: number
          required: [high, increasing, low, recommendedStock]
      required: [items, summary]
    AnalyticsResponse:
      type: object
      properties:
        monthlySales:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              sales:
                type: number
              orders:
                type: number
            required: [month, sales, orders]
        categorySales:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              value:
                type: number
            required: [category, value]
        totalSales:
          type: number
        averageOrder:
          type: number
        growth:
          type: number
      required: [monthlySales, categorySales, totalSales, averageOrder, growth]
    RouteStop:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        orders:
          type: number
        eta:
          type: string
        status:
          type: string
      required: [name, location, orders, eta, status]
    LogisticsResponse:
      type: object
      properties:
        activeDeliveries:
          type: number
        onTimeRate:
          type: number
        milesSaved:
          type: number
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStop"
      required: [activeDeliveries, onTimeRate, milesSaved, stops]
    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [farmer, customer]
        phone:
          type: string
        location:
          type: string
        farmName:
          type: string
        farmingType:
          type: string
        address:
          type: string
        products:
          type: number
      required: [id, name, email, role, phone, location, farmName, farmingType, address, products]
    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        location:
          type: string
        farmName:
          type: string
        farmingType:
          type: string
        address:
          type: string